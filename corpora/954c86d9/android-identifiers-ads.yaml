# Verbatim from the use cases under the page's heading "Ads" (Targeting, Measurement, Conversions, Remarketing) and
# "Ad fraud", which the page lists under "Security"; omissions marked […]. Measurement and Conversions also name the
# Play install referrer APIs, an alternative to an identifier for attribution. This is what keeps an app-scoped identifier from being proposed for advertising.
text: >-
  Targeting. In this case, your app builds a profile of a user's interests, to show them more relevant ads.
  Recommended identifier to use: If your app uses an ID for ads and uploads or publishes to Google Play, that ID must
  be the Advertising ID. […] Use of the Advertising ID is mandatory for advertising use cases, per the Google Play
  Developer Content Policy, because the user can reset it. […] Measurement. In this case, your app creates a profile
  of a user based on their behavior across your organization's apps on the same device. Recommended identifier to
  use: Advertising ID or Play install referrer APIs […] Conversions. In this case, you're tracking conversions to
  detect if your marketing strategy is successful. Recommended identifier to use: Advertising ID or Play install
  referrer APIs […] Remarketing. In this case, your app shows ads based on a user's previous interests. Recommended
  identifier to use: Advertising ID […] Ad fraud. In this case, your app checks that a user's impressions and actions
  in your app are genuine and verifiable. Recommended identifier to use: Advertising ID
