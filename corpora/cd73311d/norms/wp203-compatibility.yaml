id: wp203-compatibility
title: Opinion 03/2013 on purpose limitation (WP 203), on the assessment of compatibility
source: https://ec.europa.eu/justice/article-29/documentation/opinion-recommendation/files/2013/wp203_en.pdf
retrieved: 2026-10-24
verified: {by: Thomas Cory, date: 2026-10-24}
kind: guideline
about:
  requirements: [purpose_compatible]
text: >-
  A substantive compatibility assessment requires an assessment of all relevant circumstances. In particular, account 
  should be taken of the following key factors:
  - the relationship between the purposes for which the personal data have been collected and the purposes of further 
  processing;
  - the context in which the personal data have been collected and the reasonable expectations of the data subjects as 
  to their further use;
  - the nature of the personal data and the impact of the further processing on the data subjects;
  - the safeguards adopted by the controller to ensure fair processing and to prevent any undue impact on the data 
  subjects.
