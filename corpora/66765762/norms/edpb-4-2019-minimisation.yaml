id: edpb-4-2019-minimisation
title: EDPB Guidelines 4/2019 on Article 25 (version 2.0), data minimisation (paras. 74–76, p. 21)
source: https://www.edpb.europa.eu/sites/default/files/files/file1/edpb_guidelines_201904_dataprotection_by_design_and_by_default_v2.0_en.pdf
retrieved: 2026-11-21
verified: {by: Thomas Cory, date: 2026-11-21, note: "added or changed by the author's decision of 21 Nov (second round); each quoted segment checked against its source by script, in order, and by an independent review (corpora/adoption-2026-11-21.md)"}
