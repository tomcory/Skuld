# Drafted 21 Nov 2026: verbatim from the PDF; three of the eight elements of para. 72, and footnote 34 (on p. 19,
# attached to the section heading 3.4), which states the status of WP29's Opinion 03/2013 that the passages
# wp203-specific and wp203-compatibility quote; "EDBP" is the source's spelling; the footnote's URL is left out
# ([…]). The footnote comes first, as in the source, where it stands at the heading of section 3.4 before
# paras. 71-72. The paper (Sect. 2) cites para. 72 and fn. 34.
# Changed 21 Nov (author's decision): para. 71 added before para. 72's elements, as in the source; its
# footnote marker 35 removed. Para. 71 states that compatibility is assessed by the criteria of Art. 6(4).
# Footnote 34 states the status of the Opinion that wp203-specific, wp203-compatibility and wp203-factors quote.
text: >-
  [Footnote 34:] The Article 29 Working Party provided guidance for the understanding of the principle of purpose
  limitation under Directive 95/46/EC. Although the Opinion is not adopted by the EDBP [sic], it may still be relevant
  as the wording of the principle is the same under the GDPR. Article 29 Working Party. “Opinion 03/2013 on purpose
  limitation”. WP 203, 2 April 2013. […] The controller must collect data for specified, explicit, and legitimate
  purposes, and not further process the data in a manner that is incompatible with the purposes for which they were
  collected. The design of the processing should therefore be shaped by what is necessary to achieve the purposes. If
  any further processing is to take place, the controller must first make sure that this processing has purposes
  compatible with the original ones and design such processing accordingly. Whether a new purpose is compatible or
  not, shall be assessed according to the criteria in Article 6(4). Key design and default purpose limitation elements
  may include: […] Specificity – The purposes shall be specified and explicit as to why personal data is being
  processed. […] Necessity – The purpose determines what personal data is necessary for the processing. Compatibility
  – Any new purpose must be compatible with the original purpose for which the data was collected and guide relevant
  changes in design. […]
