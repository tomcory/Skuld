# The alternative to access to the whole media library (TODO.md: photo picker against storage access).
text: >-
  The photo picker provides a browsable interface that presents the user with their media library, sorted by date from
  newest to oldest. As shown in the privacy best practices codelab, the photo picker provides a safe, built-in way for
  users to grant your app access to only selected images and videos, instead of their entire media library.
