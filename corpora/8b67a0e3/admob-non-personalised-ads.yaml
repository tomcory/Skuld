text: >-
  Google considers ads to be personalized when they are based on previously collected or historical data to determine
  or influence ad selection, including activity like previous search queries, visits to sites or apps, location, or
  demographic information. […] Non-personalized ads are not based on a user’s past behavior. Instead, they use
  contextual information, including coarse geo-targeting (such as city-level) based on current location, content on
  the current site or app, or current query terms. When serving non-personalized ads, Google Ad Manager disallows all
  data used for personalization, including demographic targeting and user list targeting. Although non-personalized
  ads don’t use cookies or mobile ad identifiers for ad targeting, they do still use cookies or mobile ad identifiers
  for frequency capping and aggregated ad reporting.
