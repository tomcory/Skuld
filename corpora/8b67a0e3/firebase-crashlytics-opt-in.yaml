# practices, of which 16 involve a Crashlytics or Firebase host). Kept by the author's decision of 21 Nov.
text: >-
  If you enable opt-in reporting by disabling automatic reporting, you will reduce the accuracy of your app's event
  count and crash-free metrics, which makes them less reflective of the overall stability of your app. […] By default,
  Crashlytics automatically collects crash reports for all your app's users. To give users more control over the data
  they send, you can enable opt-in reporting by disabling automatic reporting and only sending data to Crashlytics
  when you choose to in your code. […] When data collection is disabled for a user, Crashlytics will store crash
  information locally on the device. If data collection is subsequently enabled, any crash information stored on the
  device will be sent to Crashlytics for processing.
