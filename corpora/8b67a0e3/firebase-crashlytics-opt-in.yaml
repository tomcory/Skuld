# Drafted 21 Nov 2026: verbatim from the section "Enable opt-in reporting" (page last updated 2026-11-19), code
# samples left out; omissions marked […]. Licence: CC BY 4.0 (page footer). The section's first sentence states
# the cost of the alternative (less accurate metrics), kept so that the passage is not one-sided. Known limit: the
# registry's entity google also holds YouTube, Sign-in, Drive, Maps, fonts and Google's ad hosts, so the passage is
