id: ai-image-editing
version: 3
name: AI image editing
entry: the app's main interface or an AI tools section
path: upload an image and provide a natural language description of the desired changes
outcome: the edited image is displayed with options to save or further modify it
purposes:
- id: P1
  action: edit
  object: the user's image
  beneficiary: user
  context: a change the user describes in words
  outcome: the image edited as asked
  node: RequestedServiceProvision
  fit: broader
  specificity: sufficient
  role: functional
  requirements:
  - id: R1
    statement: take the user's image
  - id: R2
    statement: interpret the user's text request
  - id: R3
    statement: apply modifications to the image based on the request
  oracle:
    reach:
    - R1
    - R2
    - R3
    success:
    - screen_reached:
        exact_key: '{result_screen}'
        after_action: '{path_start}'
        until_action: '{path_end}'
    invalid:
    - hold_above_ms: 1000
    measurements: []
    slots:
      result_screen:
        kind: screen
        description: the screen showing the edited image and post-processing options
author:
  kind: model
  name: claude-opus-5-5
  prompt: 'written in the assessor''s session, at the author''s direction (21 Nov 2026), from the catalogue review of 21 Nov
    (reviews/notes-2026-11-21.md): version 2 with R1 ''take the user''s image'' (not recognise it), the action and object
    split, the name in lower case, fit broader. The oracle stays a screen check (the result is an image without text); an
    error, paywall or ''credits used up'' dialog over the result screen may share its key, and an app that edits on the device
    preserves the network control truthfully'
created: '2026-11-21'
derived_from:
  family: ai-image-editing
  version: 2
control:
  intervention: network
  expected: breaks
