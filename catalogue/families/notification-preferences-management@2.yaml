id: notification-preferences-management
version: 2
name: notification preferences management
entry: the app's settings or profile screen
path: navigate to notification settings and modify the preferences for communication channels
outcome: the settings screen showing the updated preferences or a confirmation of the changes
purposes:
- id: P1
  action: let the user choose
  object: the notifications they receive
  beneficiary: user
  context: the app's settings
  outcome: user controls which notifications they receive
  node: CommunicationManagement
  fit: broader
  specificity: sufficient
  role: functional
  requirements:
  - id: R1
    statement: show the notification settings
  - id: R2
    statement: let the user select or deselect specific notification types
  oracle:
    reach:
    - R1
    success:
    - screen_reached:
        exact_key: '{settings_screen}'
        after_action: '{path_start}'
        until_action: '{path_end}'
    invalid:
    - hold_above_ms: 1000
    measurements: []
    slots:
      settings_screen:
        kind: screen
        description: the screen where notification preferences are managed
