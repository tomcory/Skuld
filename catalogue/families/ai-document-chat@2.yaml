name: AI Chat for Documents
entry: the app's main interface or a tools menu
path: select a document and ask a question about its content via an AI chat interface
outcome: the AI's response to the question based on the document's content
purposes:
- id: P1
  action: extract and analyze information from documents
  object: document content
  beneficiary: user
  context: user query
  outcome: answer to the query
  node: RequestedServiceProvision
  fit: exact
  specificity: sufficient
  role: functional
  requirements:
  - id: R1
    statement: access a document
  - id: R2
    statement: process natural language queries
  - id: R3
    statement: analyze document content
  oracle:
