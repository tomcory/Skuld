    quote: "a unique, user-resettable, and user-deletable ID for advertising"
text: >-
  The advertising ID is a unique, user-resettable, and user-deletable ID for advertising, provided by Google Play
  services. […] As part of Google Play services update in late 2021, the advertising ID will be removed when a user
  deletes their advertising ID in Android Settings. Any attempts to access the identifier will receive a string of
  zeros instead of the identifier. […] For essential non ads use-cases such as analytics and fraud prevention, use App
  Set ID.
