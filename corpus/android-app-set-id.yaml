facts:
  - about: device-or-other-ids.app-set-id
    kind: scope
    value: developer
    quote: "an ID scoped to the set of apps published under the same Google Play developer account"
  - about: device-or-other-ids.app-set-id
    kind: persists
    value: reinstall
    quote: "The last app from a given set of apps is uninstalled from the device."
text: >-
  For use cases such as analytics or fraud prevention on a given device, you might need to correlate usage or actions
  across a set of apps owned by your organization. Google Play services offers a privacy-friendly option called app
  set ID. […] For apps that are installed by the Google Play store, the app set ID API returns an ID scoped to the set
  of apps published under the same Google Play developer account. […] Under any of the following conditions, the app
  set ID for a given set of Google Play store-installed apps on a device can be reset: - The app set ID API hasn't
  been accessed by the groups of apps that share the same ID value for over 13 months. - The last app from a given set
  of apps is uninstalled from the device. - The user performs a factory reset of the device.
