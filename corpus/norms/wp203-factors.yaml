id: wp203-factors
title: Opinion 03/2013 on purpose limitation (WP 203), the key factors of the compatibility assessment (Sect. III.2.2, pp. 23–27; WP29 under Directive 95/46/EC; not adopted by the EDPB, which notes that it may still be relevant as the wording of the principle is the same under the GDPR (Guidelines 4/2019, fn. 34))
source: https://ec.europa.eu/justice/article-29/documentation/opinion-recommendation/files/2013/wp203_en.pdf
retrieved: 2026-11-21
kind: guideline
authority: wp29
verified: {by: Thomas Cory, date: 2026-11-21, note: "added or changed by the author's decision of 21 Nov (second round); each quoted segment checked against its source by script, in order, and by an independent review (corpora/adoption-2026-11-21.md)"}
