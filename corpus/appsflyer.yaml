text: >-
  A mobile measurement partner, or MMP, is a company that helps apps measure campaign performance across advertising
  marketing channels, media sources, and ad networks. […] A mobile measurement partner is a platform provider that
  attributes, collects, and organizes app data to deliver a uniform assessment of campaign performance metrics. […]
  In basic terms, an MMP matches campaign engagements with installs and post-intall in-app actions. This is done
  using a combination of device IDs for user level attribution, probabilistic modeling, or SKAdNetwork in
  iOS 14 for deterministic aggregated level attribution. By implementing a software development kit (SDK), which is a
  piece of code that collects measurement and attribution data, the app enables the MMP to associate ad engagements
  with app installs and in-app events (such as game levels, registrations completed in a FinTech app, placed purchases
  etc).
